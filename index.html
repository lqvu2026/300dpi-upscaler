<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MP3 Converter">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Audio to MP3 converter</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
<style>
:root{--bg:#eef1ee;--ink:#17262b;--mute:#5d6e72;--line:#c9d3d0;--panel:#fafbfa;--accent:#0b6b5f;--accent-ink:#fff;--err:#b3261e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181a;--ink:#e6efed;--mute:#8fa3a6;--line:#2b3b3e;--panel:#172124;--accent:#4cc9b4;--accent-ink:#06201c;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#10181a;--ink:#e6efed;--mute:#8fa3a6;--line:#2b3b3e;--panel:#172124;--accent:#4cc9b4;--accent-ink:#06201c;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:640px;margin:0 auto;padding:40px 20px 56px}
h1{font-size:clamp(2rem,7vw,3.2rem);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin:0 0 10px}
.lead{color:var(--mute);margin:0 0 28px;max-width:46ch}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;background:var(--panel);padding:36px 20px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over,.drop:focus-within{border-color:var(--accent)}
.drop strong{display:block;font-size:1.15rem;font-weight:600}
.drop span{color:var(--mute);font-size:.92rem}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:20px 0}
label.sel{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.95rem}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:11px 20px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
button:disabled{opacity:.45;cursor:not-allowed}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
.name{font-weight:600;overflow-wrap:anywhere}
.meta{color:var(--mute);font-size:.88rem}
.meta.err{color:var(--err)}
.bar{grid-column:1/-1;height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s}
.dl{align-self:center;grid-row:1/3;grid-column:2;background:transparent;color:var(--accent);font-weight:600;text-decoration:none;border:1px solid var(--accent);border-radius:8px;padding:6px 12px}
.note{color:var(--mute);font-size:.85rem;margin-top:28px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <h1>Turn any audio file into an MP3</h1>
  <p class="lead">Works with M4A, WAV, OGG, FLAC, AAC and more. Files are converted on your device and never uploaded.</p>

  <label class="drop" id="drop">
    <strong>Choose audio files</strong>
    <span>or drop them here</span>
    <input id="file" type="file" accept="audio/*,.m4a,.aac,.flac,.ogg,.opus,.wav,.mp4" multiple>
  </label>

  <div class="opts">
    <label class="sel">Quality
      <select id="kbps">
        <option value="128">128 kbps (small)</option>
        <option value="192" selected>192 kbps (balanced)</option>
        <option value="256">256 kbps</option>
        <option value="320">320 kbps (best)</option>
      </select>
    </label>
    <button id="go" disabled>Convert to MP3</button>
    <button id="clear" class="ghost" hidden>Clear list</button>
  </div>

  <ul id="list" aria-live="polite"></ul>
  <p class="note">If a file fails to convert, your browser can't decode that format. Try Chrome, Edge or Safari.</p>
</main>

<script>
(function(){
  var items=[], busy=false;
  var $=function(id){return document.getElementById(id)};
  var drop=$('drop'), input=$('file'), list=$('list'), go=$('go'), clear=$('clear');

  function size(b){return b>1048576?(b/1048576).toFixed(1)+' MB':Math.max(1,Math.round(b/1024))+' KB'}
  function add(files){
    Array.prototype.forEach.call(files,function(f){
      var li=document.createElement('li');
      li.innerHTML='<div><div class="name"></div><div class="meta">Ready · '+size(f.size)+'</div></div><div class="bar"><i></i></div>';
      li.querySelector('.name').textContent=f.name;
      list.appendChild(li);
      items.push({file:f,li:li,done:false});
    });
    refresh();
  }
  function refresh(){
    go.disabled=busy||!items.some(function(i){return !i.done});
    clear.hidden=!items.length;
  }
  input.addEventListener('change',function(){add(input.files);input.value=''});
  ['dragenter','dragover'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.add('over')})});
  ['dragleave','drop'].forEach(function(e){drop.addEventListener(e,function(ev){ev.preventDefault();drop.classList.remove('over')})});
  drop.addEventListener('drop',function(ev){if(ev.dataTransfer&&ev.dataTransfer.files)add(ev.dataTransfer.files)});
  clear.addEventListener('click',function(){if(busy)return;items.forEach(function(i){if(i.url)URL.revokeObjectURL(i.url)});items=[];list.innerHTML='';refresh()});

  function toInt16(f){
    var o=new Int16Array(f.length);
    for(var i=0;i<f.length;i++){var s=Math.max(-1,Math.min(1,f[i]));o[i]=s<0?s*32768:s*32767}
    return o;
  }
  var tick=function(){return new Promise(function(r){setTimeout(r,0)})};

  async function encode(buf,kbps,onProg){
    var ch=Math.min(buf.numberOfChannels,2);
    var enc=new lamejs.Mp3Encoder(ch,buf.sampleRate,kbps);
    var L=toInt16(buf.getChannelData(0)), R=ch>1?toInt16(buf.getChannelData(1)):null;
    var block=1152*8, out=[];
    for(var i=0,n=0;i<L.length;i+=block,n++){
      var l=L.subarray(i,i+block), r=R?R.subarray(i,i+block):null;
      var d=ch>1?enc.encodeBuffer(l,r):enc.encodeBuffer(l);
      if(d.length)out.push(new Uint8Array(d));
      if(n%40===0){onProg(i/L.length);await tick()}
    }
    var end=enc.flush(); if(end.length)out.push(new Uint8Array(end));
    return new Blob(out,{type:'audio/mpeg'});
  }

  go.addEventListener('click',async function(){
    busy=true; refresh();
    var kbps=parseInt($('kbps').value,10);
    var AC=window.AudioContext||window.webkitAudioContext;
    var ctx=new AC();
    for(var k=0;k<items.length;k++){
      const it=items[k]; if(it.done)continue;
      const meta=it.li.querySelector(".meta"), bar=it.li.querySelector(".bar i");
      meta.className='meta'; meta.textContent='Reading file…';
      try{
        var data=await it.file.arrayBuffer();
        meta.textContent='Decoding audio…'; await tick();
        var buf=await new Promise(function(res,rej){ctx.decodeAudioData(data,res,rej)});
        meta.textContent='Encoding to MP3…';
        const blob=await encode(buf,kbps,function(p){bar.style.width=(p*100).toFixed(0)+'%'});
        bar.style.width='100%';
        it.url=URL.createObjectURL(blob); it.done=true;
        const a=document.createElement('a');
        a.className='dl'; a.textContent='Download MP3';
        a.href=it.url; a.download=it.file.name.replace(/\.[^.]+$/,'')+'.mp3';
        it.li.appendChild(a);
        meta.textContent='Done · '+size(blob.size)+' · '+kbps+' kbps';
      }catch(e){
        meta.className='meta err';
        meta.textContent="Couldn't convert this file. Your browser may not support its format.";
        bar.style.width='0';
        it.done=true;
      }
    }
    try{ctx.close()}catch(e){}
    busy=false; refresh();
  });
})();
</script>
</body>
</html>
